[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clop-kde"
version = "0.0.1"
description = "Background media optimizer for KDE Plasma 6"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "Pillow>=10", "ruff>=0.9"]

[project.scripts]
clop-kde = "clop_kde.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clop_kde"]

[tool.hatch.build.targets.wheel.force-include]
"src/clop_kde/assets" = "clop_kde/assets"
"src/clop_kde/plasmoid_pkg" = "clop_kde/plasmoid_pkg"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
